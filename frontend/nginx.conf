server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (hashed filenames from CRA build) — cache aggressively.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any unknown path serves index.html so client-side
    # routing (if any) and direct refreshes both work.
    location / {
        try_files $uri /index.html;
    }
}
