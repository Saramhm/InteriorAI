server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (hashed filenames from CRA build) — cache aggressively.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — any unknown path serves index.html so client-side
    # routing (if any) and direct refreshes both work.
    location / {
        try_files $uri /index.html;
    }

    # index.html references the current build's hashed JS/CSS filenames, so a
    # stale cached copy of it (mobile browsers cache HTML far more eagerly
    # than desktop ones do) keeps loading an old bundle indefinitely, even
    # after a fresh deploy (reported: "still shows offline on my phone").
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
